<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramalhete de Lírios Rosa 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #2a4a32 0%, #1a3322 45%, #0b1a10 100%);
    font-family: Georgia, 'Times New Roman', serif;
  }

  #cena {
    position: fixed;
    inset: 0;
    display: block;
  }

  .titulo {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: #ffe9f2;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .titulo p {
    font-size: clamp(1.5rem, 3.5vw, 2.3rem);
    font-style: italic;
    letter-spacing: 0.12em;
    color: #f7d2e0;
  }

  .bokeh {
    position: fixed;
    border-radius: 50%;
    filter: blur(18px);
    opacity: 0.18;
    pointer-events: none;
    animation: flutuar 14s ease-in-out infinite alternate;
  }
  @keyframes flutuar {
    from { transform: translateY(0px); }
    to   { transform: translateY(-40px); }
  }
</style>
</head>
<body>

<div class="titulo">
  <p>Para você Livia</p>
</div>

<div class="bokeh" style="left:8%;  top:65%; width:120px; height:120px; background:#e8a0bf; animation-delay:0s;"></div>
<div class="bokeh" style="left:85%; top:30%; width:90px;  height:90px;  background:#bde3a8; animation-delay:-4s;"></div>
<div class="bokeh" style="left:75%; top:75%; width:140px; height:140px; background:#f0c4d8; animation-delay:-8s;"></div>
<div class="bokeh" style="left:15%; top:20%; width:80px;  height:80px;  background:#a8d8b0; animation-delay:-11s;"></div>

<canvas id="cena"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const rnd = (min, max) => min + Math.random() * (max - min);
const escolher = (lista) => lista[Math.floor(Math.random() * lista.length)];

// ---------------------------------------------------------------- cena base
const canvas = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();

// ambiente PBR suave para reflexos realistas nas pétalas
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.0, 11.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;

// ------------------------------------------------------------------- luzes
scene.add(new THREE.HemisphereLight(0xfff2f6, 0x2a4030, 0.8));

const sol = new THREE.DirectionalLight(0xfff3e2, 1.5);
sol.position.set(5, 8, 6);
scene.add(sol);

const contraluz = new THREE.DirectionalLight(0xd8e8ff, 0.45);
contraluz.position.set(-5, 3, -6);
scene.add(contraluz);

// preenchimento frontal que acompanha a câmera, para iluminar o miolo das flores
const preenchimento = new THREE.DirectionalLight(0xfff0f4, 0.8);
camera.add(preenchimento);
preenchimento.position.set(0, 1.5, 2);
scene.add(camera);

// -------------------------------------------------- texturas das pétalas
// cada variante tem pintas, nervuras e manchas próprias, para que as
// pétalas não pareçam clonadas
function texturaPetala(opcoes) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 1024;
  const g = c.getContext('2d');

  // fundo: rosa escuro na base subindo para rosa médio; pontas claras
  const fundo = g.createLinearGradient(0, 1024, 0, 0);
  fundo.addColorStop(0.00, opcoes.corBase);
  fundo.addColorStop(0.50, opcoes.corMeio);
  fundo.addColorStop(0.88, '#eda4c4');
  fundo.addColorStop(1.00, '#f6cfdf');
  g.fillStyle = fundo;
  g.fillRect(0, 0, 512, 1024);

  // bordas brancas com transição bem suave para o rosa
  const bordas = g.createLinearGradient(0, 0, 512, 0);
  bordas.addColorStop(0.00, 'rgba(255,251,253,0.98)');
  bordas.addColorStop(0.07, 'rgba(255,251,253,0.85)');
  bordas.addColorStop(0.30, 'rgba(255,251,253,0)');
  bordas.addColorStop(0.70, 'rgba(255,251,253,0)');
  bordas.addColorStop(0.93, 'rgba(255,251,253,0.85)');
  bordas.addColorStop(1.00, 'rgba(255,251,253,0.98)');
  g.fillStyle = bordas;
  g.fillRect(0, 0, 512, 1024);

  // ponta da pétala também clareando para branco
  const ponta = g.createLinearGradient(0, 0, 0, 230);
  ponta.addColorStop(0.00, 'rgba(255,251,253,0.9)');
  ponta.addColorStop(1.00, 'rgba(255,251,253,0)');
  g.fillStyle = ponta;
  g.fillRect(0, 0, 512, 230);

  // faixa central mais intensa
  const intensidade = opcoes.faixa;
  const faixa = g.createLinearGradient(0, 0, 512, 0);
  faixa.addColorStop(0.00, 'rgba(186,28,94,0)');
  faixa.addColorStop(0.42, `rgba(186,28,94,${intensidade})`);
  faixa.addColorStop(0.50, `rgba(168,18,82,${intensidade + 0.12})`);
  faixa.addColorStop(0.58, `rgba(186,28,94,${intensidade})`);
  faixa.addColorStop(1.00, 'rgba(186,28,94,0)');
  g.fillStyle = faixa;
  g.fillRect(0, 180, 512, 844);

  // nervuras finas irradiando da base
  g.lineWidth = 1.6;
  for (let i = -6; i <= 6; i++) {
    g.strokeStyle = `rgba(176,42,104,${rnd(0.12, 0.26)})`;
    g.beginPath();
    g.moveTo(256 + i * 7, 1014);
    g.quadraticCurveTo(
      256 + i * 26 + rnd(-10, 10), 600,
      256 + i * (34 + rnd(-6, 8)), rnd(60, 160)
    );
    g.stroke();
  }

  // guia de néctar esverdeada na base
  const nectar = g.createRadialGradient(256, 1010, 10, 256, 1010, 140);
  nectar.addColorStop(0, 'rgba(206,220,140,0.9)');
  nectar.addColorStop(1, 'rgba(206,220,140,0)');
  g.fillStyle = nectar;
  g.fillRect(116, 870, 280, 154);

  // pintas escuras (sardas do lírio Stargazer), distribuição única por variante
  const qtd = Math.floor(rnd(45, 75));
  for (let i = 0; i < qtd; i++) {
    const x = 256 + (Math.random() - 0.5) * 270;
    const y = 1024 - Math.random() * Math.random() * 660 - 60;
    const r = rnd(2.5, 6.5);
    g.fillStyle = escolher([
      'rgba(132,21,56,0.85)', 'rgba(152,26,68,0.7)', 'rgba(110,16,46,0.8)',
    ]);
    g.beginPath();
    g.ellipse(x, y, r, r * rnd(1.2, 1.8), rnd(0, Math.PI), 0, Math.PI * 2);
    g.fill();
  }

  // imperfeições: leves manchas amareladas/queimadas perto da ponta
  if (opcoes.imperfeicoes) {
    for (let i = 0; i < 4; i++) {
      const x = rnd(60, 452), y = rnd(30, 240);
      const mancha = g.createRadialGradient(x, y, 2, x, y, rnd(14, 30));
      mancha.addColorStop(0, `rgba(201,164,120,${rnd(0.10, 0.20)})`);
      mancha.addColorStop(1, 'rgba(201,164,120,0)');
      g.fillStyle = mancha;
      g.fillRect(x - 32, y - 32, 64, 64);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function texturaFolha(corEscura, corClara) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 256;
  const g = c.getContext('2d');
  const fundo = g.createLinearGradient(0, 256, 0, 0);
  fundo.addColorStop(0, corEscura);
  fundo.addColorStop(1, corClara);
  g.fillStyle = fundo;
  g.fillRect(0, 0, 128, 256);
  g.strokeStyle = 'rgba(20,60,25,0.6)';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(64, 256); g.lineTo(64, 0); g.stroke();
  // nervuras paralelas suaves (folha de lírio)
  g.lineWidth = 1;
  for (const dx of [-34, -18, 18, 34]) {
    g.strokeStyle = 'rgba(20,60,25,0.25)';
    g.beginPath();
    g.moveTo(64 + dx * 0.4, 256);
    g.quadraticCurveTo(64 + dx, 128, 64 + dx * 0.3, 0);
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// textura de papel kraft com fibras, vincos e manchas
function texturaKraft() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#ddbd92';
  g.fillRect(0, 0, 512, 512);

  // manchas suaves de tom
  for (let i = 0; i < 26; i++) {
    const x = rnd(0, 512), y = rnd(0, 512), r = rnd(30, 110);
    const mancha = g.createRadialGradient(x, y, 2, x, y, r);
    const escura = Math.random() > 0.5;
    mancha.addColorStop(0, escura ? 'rgba(146,108,62,0.14)' : 'rgba(238,214,170,0.16)');
    mancha.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mancha;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // fibras do papel: tracinhos curtos em todas as direções
  for (let i = 0; i < 1400; i++) {
    const x = rnd(0, 512), y = rnd(0, 512);
    const ang = rnd(0, Math.PI), len = rnd(2, 9);
    g.strokeStyle = Math.random() > 0.5
      ? `rgba(120,86,46,${rnd(0.05, 0.16)})`
      : `rgba(240,220,180,${rnd(0.05, 0.14)})`;
    g.lineWidth = rnd(0.5, 1.2);
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }

  // vincos verticais (dobras do papel)
  for (let i = 0; i < 22; i++) {
    const x = rnd(0, 512);
    g.strokeStyle = `rgba(96,66,32,${rnd(0.08, 0.2)})`;
    g.lineWidth = rnd(1, 2.6);
    g.beginPath();
    g.moveTo(x, 512);
    g.quadraticCurveTo(x + rnd(-26, 26), 256, x + rnd(-40, 40), 0);
    g.stroke();
    // brilho ao lado do vinco
    g.strokeStyle = `rgba(248,228,190,${rnd(0.07, 0.15)})`;
    g.lineWidth = rnd(0.8, 1.6);
    g.beginPath();
    g.moveTo(x + 3, 512);
    g.quadraticCurveTo(x + rnd(-22, 30), 256, x + rnd(-36, 44), 0);
    g.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(4, 1);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// ------------------------------------------- geometria paramétrica de pétala
// malha densa (72x28) e curvaturas compostas: arco da linha central,
// canaleta na base, dobra das bordas na ponta, torção e ondulação irregular
function geometriaPetala(o) {
  const segU = 72, segV = 28;
  const pos = [], uv = [], idx = [];
  const faseOnd = rnd(0, Math.PI * 2);
  const faseOnd2 = rnd(0, Math.PI * 2);

  for (let i = 0; i <= segU; i++) {
    const u = i / segU;
    const w = o.largura * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.72)), 0.85);
    // linha central: arqueia para cima e recurva a ponta para trás
    const yc = o.arco * Math.sin(Math.PI * u * 0.85) - o.recurvo * Math.pow(u, 3.2);
    const torcao = o.torcao * u;
    const ct = Math.cos(torcao), st = Math.sin(torcao);

    for (let j = 0; j <= segV; j++) {
      const v = (j / segV) * 2 - 1;
      // assimetria: um lado da pétala um pouco mais largo que o outro
      const dx = v * w * 0.5 * (1 + o.assimetria * v);
      // canaleta funda perto da base, abrindo ao longo do comprimento
      let dy = o.canaleta * w * v * v * (1.2 - u * 0.8);
      // bordas dobrando para trás na metade externa (recurvo lateral)
      dy -= o.dobraBorda * w * Math.pow(Math.abs(v), 2.2) * Math.pow(u, 2.2);
      // ondulação irregular em duas frequências, mais forte na ponta
      dy += o.ondulacao * Math.sin(v * Math.PI * 2.3 + faseOnd + u * 5.0)
            * Math.abs(v) * u * u;
      dy += o.ondulacao * 0.55 * Math.sin(v * Math.PI * 4.1 + faseOnd2 + u * 9.0)
            * Math.abs(v) * Math.pow(u, 1.6);
      // torção aplicada à seção transversal
      pos.push(dx * ct - dy * st, yc + dx * st + dy * ct, u * o.comprimento);
      uv.push(j / segV, u);
    }
  }

  const linha = segV + 1;
  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const a = i * linha + j;
      idx.push(a, a + linha, a + 1, a + 1, a + linha, a + linha + 1);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

// ----------------------------------------------------------------- materiais
const materiaisPetala = [
  { corBase: '#c9326f', corMeio: '#dd6398', faixa: 0.42, imperfeicoes: true },
  { corBase: '#bd2a66', corMeio: '#d65590', faixa: 0.5, imperfeicoes: false },
  { corBase: '#d23c7b', corMeio: '#e26fa3', faixa: 0.36, imperfeicoes: true },
].map(opcoes => new THREE.MeshPhysicalMaterial({
  map: texturaPetala(opcoes),
  side: THREE.DoubleSide,
  roughness: rnd(0.5, 0.62),
  metalness: 0.0,
  sheen: 0.5,
  sheenColor: new THREE.Color(0xffc4dd),
  sheenRoughness: 0.6,
  envMapIntensity: 0.4,
}));

const materiaisFolha = [
  texturaFolha('#2d6b30', '#4a8c46'),
  texturaFolha('#275c2b', '#3f7c3c'),
  texturaFolha('#346f33', '#569551'),
].map(tex => new THREE.MeshStandardMaterial({
  map: tex, side: THREE.DoubleSide, roughness: 0.7, envMapIntensity: 0.35,
}));

const matFilamento = new THREE.MeshStandardMaterial({ color: 0xe8e4c9, roughness: 0.6, envMapIntensity: 0.3 });
const materiaisAntera = [0x6b2b1f, 0x7a3a22, 0x5c2418].map(
  cor => new THREE.MeshStandardMaterial({ color: cor, roughness: 0.85, envMapIntensity: 0.25 })
);
const matPistilo = new THREE.MeshStandardMaterial({ color: 0xd9e0b8, roughness: 0.6, envMapIntensity: 0.3 });
const matEstigma = new THREE.MeshStandardMaterial({ color: 0x5a2a33, roughness: 0.7, envMapIntensity: 0.25 });
const matCaule = new THREE.MeshStandardMaterial({ color: 0x3e7d3a, roughness: 0.75, envMapIntensity: 0.3 });

const texKraft = texturaKraft();
const matKraftExterno = new THREE.MeshStandardMaterial({
  map: texKraft, side: THREE.DoubleSide, roughness: 0.88, envMapIntensity: 0.6,
});
const matKraftInterno = new THREE.MeshStandardMaterial({
  map: texKraft, side: THREE.DoubleSide, roughness: 0.9, envMapIntensity: 0.55,
  color: 0xd8b88c,
});
const matRafia = new THREE.MeshStandardMaterial({ color: 0xc9a05a, roughness: 0.8, envMapIntensity: 0.25 });
const matMosquitinho = new THREE.MeshStandardMaterial({ color: 0xf7f4ee, roughness: 0.9, envMapIntensity: 0.2 });
const matTaloFino = new THREE.MeshStandardMaterial({ color: 0x6f8f4a, roughness: 0.8, envMapIntensity: 0.2 });
const matRaminho = new THREE.MeshStandardMaterial({ color: 0x55793c, roughness: 0.8, envMapIntensity: 0.2 });

// ------------------------------------------------------------------ estames
function criarEstame(angulo) {
  const dir = new THREE.Vector3(Math.cos(angulo), 0, Math.sin(angulo));
  const alcance = rnd(0.68, 0.9);
  const altura = rnd(1.0, 1.28);
  const fim = dir.clone().multiplyScalar(alcance).setY(altura);
  const curva = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.08, 0),
    dir.clone().multiplyScalar(alcance * 0.28).setY(altura * rnd(0.42, 0.55)),
    dir.clone().multiplyScalar(alcance * 0.66).setY(altura * rnd(0.78, 0.9)),
    fim,
  ]);
  const filamento = new THREE.Mesh(new THREE.TubeGeometry(curva, 20, 0.022, 6), matFilamento);

  const antera = new THREE.Mesh(
    new THREE.CapsuleGeometry(rnd(0.04, 0.052), rnd(0.14, 0.2), 4, 8),
    escolher(materiaisAntera)
  );
  antera.position.copy(fim);
  const perp = new THREE.Vector3(-Math.sin(angulo), rnd(0.05, 0.35), Math.cos(angulo)).normalize();
  antera.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), perp);
  antera.rotateY(rnd(-0.4, 0.4));

  const g = new THREE.Group();
  g.add(filamento, antera);
  return g;
}

function criarPistilo() {
  const inclinacao = rnd(-0.18, 0.18);
  const curva = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.05, 0),
    new THREE.Vector3(0.05 + inclinacao * 0.4, 0.7, 0.03),
    new THREE.Vector3(0.1 + inclinacao, rnd(1.25, 1.45), 0.05),
  ]);
  const tubo = new THREE.Mesh(new THREE.TubeGeometry(curva, 16, 0.03, 6), matPistilo);
  const estigma = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), matEstigma);
  estigma.scale.set(1, 0.65, 1);
  estigma.position.copy(curva.getPoint(1));
  const g = new THREE.Group();
  g.add(tubo, estigma);
  return g;
}

// --------------------------------------------------------------------- flor
// cada flor sorteia tamanho, abertura e pétalas próprias — nenhuma é igual
function criarFlor() {
  const flor = new THREE.Group();
  const escala = rnd(0.88, 1.1);
  const abertura = rnd(-0.08, 0.08);

  function adicionarPetala(anguloBase, externa) {
    const suporte = new THREE.Group();
    suporte.rotation.y = anguloBase + rnd(-0.07, 0.07);
    const geo = geometriaPetala({
      comprimento: (externa ? 2.15 : 1.95) * rnd(0.93, 1.08),
      largura: (externa ? 1.0 : 1.2) * rnd(0.92, 1.08),
      arco: rnd(0.85, 1.1),
      recurvo: rnd(0.4, 0.65),
      torcao: rnd(-0.16, 0.16),
      ondulacao: rnd(0.06, 0.14),
      assimetria: rnd(-0.08, 0.08),
      canaleta: rnd(0.26, 0.42),
      dobraBorda: rnd(0.12, 0.3),
    });
    const p = new THREE.Mesh(geo, escolher(materiaisPetala));
    p.rotation.x = (externa ? -0.42 : -0.58) + abertura + rnd(-0.07, 0.07);
    p.rotation.z = rnd(-0.05, 0.05);
    suporte.add(p);
    flor.add(suporte);
  }

  for (let k = 0; k < 3; k++) adicionarPetala((k / 3) * Math.PI * 2, true);
  for (let k = 0; k < 3; k++) adicionarPetala((k / 3) * Math.PI * 2 + Math.PI / 3, false);

  const nEstames = 6;
  for (let k = 0; k < nEstames; k++) {
    flor.add(criarEstame((k / nEstames) * Math.PI * 2 + 0.26 + rnd(-0.12, 0.12)));
  }
  flor.add(criarPistilo());

  flor.scale.setScalar(escala);
  return flor;
}

// --------------------------------------------------------------------- botão
// botões com tamanho, alongamento e curvatura sorteados
function criarBotao() {
  const alongamento = rnd(0.62, 0.95);
  const gordura = rnd(0.13, 0.18);
  const pontos = [];
  for (let i = 0; i <= 16; i++) {
    const t = i / 16;
    const r = gordura * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.85)), 0.9) + 0.001;
    pontos.push(new THREE.Vector2(r, t * alongamento));
  }
  const geo = new THREE.LatheGeometry(pontos, 18);

  // curvatura suave: o botão pende um pouco para um lado
  const curvatura = rnd(-0.35, 0.35);
  const posAttr = geo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const y = posAttr.getY(i);
    posAttr.setX(i, posAttr.getX(i) + curvatura * y * y);
  }
  geo.computeVertexNormals();

  // cor única por botão: do verde-creme ao rosa escuro (como na referência)
  const mistura = Math.pow(Math.random(), 0.6);
  const cor = new THREE.Color('#ccd8a8').lerp(new THREE.Color('#b34878'), mistura);
  const mat = new THREE.MeshStandardMaterial({ color: cor, roughness: 0.65, envMapIntensity: 0.3 });

  const botao = new THREE.Mesh(geo, mat);
  botao.rotation.y = rnd(0, Math.PI * 2);
  return botao;
}

// --------------------------------------------------------------------- caule
function criarCaule(origem, destino, abertura, raio) {
  const meio1 = origem.clone().lerp(destino, 0.35);
  meio1.x += abertura.x * 0.3 + rnd(-0.06, 0.06);
  meio1.z += abertura.z * 0.3 + rnd(-0.06, 0.06);
  const meio2 = origem.clone().lerp(destino, 0.7);
  meio2.x += abertura.x * 0.15 + rnd(-0.05, 0.05);
  meio2.z += abertura.z * 0.15 + rnd(-0.05, 0.05);
  const curva = new THREE.CatmullRomCurve3([origem, meio1, meio2, destino]);
  const caule = new THREE.Mesh(new THREE.TubeGeometry(curva, 24, raio, 8), matCaule);
  return { caule, curva };
}

function criarFolhaNoCaule(curva, t) {
  const geo = geometriaPetala({
    comprimento: 1.35 * rnd(0.75, 1.3),
    largura: 0.34 * rnd(0.8, 1.2),
    arco: rnd(0.3, 0.5),
    recurvo: rnd(0.25, 0.45),
    torcao: rnd(-0.3, 0.3),
    ondulacao: rnd(0.01, 0.05),
    assimetria: rnd(-0.05, 0.05),
    canaleta: rnd(0.2, 0.3),
    dobraBorda: rnd(0.02, 0.08),
  });
  const folha = new THREE.Mesh(geo, escolher(materiaisFolha));
  folha.position.copy(curva.getPoint(t));
  folha.rotation.y = rnd(0, Math.PI * 2);
  folha.rotation.x = -rnd(0.2, 0.6);
  return folha;
}

// ------------------------------------------------------- embalagem de papel
// cone enrugado de papel kraft: dobras verticais, borda irregular e
// duas camadas defasadas, como papel torcido à mão
function criarCamadaEmbalagem(material, escala, giro, alturaExtra) {
  const segT = 44, segA = 144;
  const yBase = -3.0;
  const alturaTotal = 3.2 + alturaExtra;
  const r0 = 0.3, rMax = 2.55 * escala;
  const fase1 = rnd(0, Math.PI * 2), fase2 = rnd(0, Math.PI * 2);
  const pos = [], uv = [], idx = [];

  for (let i = 0; i <= segT; i++) {
    const t = i / segT;
    for (let j = 0; j <= segA; j++) {
      const theta = (j / segA) * Math.PI * 2 + giro;
      // dobras verticais do papel em duas frequências
      const dobra = 1
        + 0.06 * Math.sin(theta * 6 + fase1)
        + 0.035 * Math.sin(theta * 11 + fase2)
        + 0.018 * Math.sin(theta * 17 + fase1 * 2);
      const r = r0 + Math.pow(t, 1.8) * (rMax - r0) * dobra;
      // borda superior irregular: pontas altas e vales, como papel dobrado
      const borda = 0.30 * Math.sin(theta * 3 + fase1)
                  + 0.18 * Math.sin(theta * 5 + fase2)
                  + 0.08 * Math.sin(theta * 9 + fase1);
      const y = yBase + t * alturaTotal + borda * t * t;
      pos.push(Math.cos(theta) * r, y, Math.sin(theta) * r);
      uv.push(j / segA, t);
    }
  }

  const linha = segA + 1;
  for (let i = 0; i < segT; i++) {
    for (let j = 0; j < segA; j++) {
      const a = i * linha + j;
      idx.push(a, a + 1, a + linha, a + 1, a + linha + 1, a + linha);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, material);
}

// laço de ráfia (palha) amarrando o papel
function criarRafia(grupo, pontoAmarra) {
  const yNo = pontoAmarra.y + 0.32;
  for (let i = 0; i < 4; i++) {
    const anel = new THREE.Mesh(new THREE.TorusGeometry(rnd(0.5, 0.56), 0.02, 6, 32), matRafia);
    anel.position.set(rnd(-0.02, 0.02), yNo + i * 0.05 + rnd(-0.015, 0.015), rnd(-0.02, 0.02));
    anel.rotation.x = Math.PI / 2 + rnd(-0.08, 0.08);
    anel.rotation.z = rnd(-0.1, 0.1);
    grupo.add(anel);
  }
  // pontas soltas de ráfia caindo
  for (let i = 0; i < 7; i++) {
    const a = rnd(0, Math.PI * 2);
    const fim = new THREE.Vector3(Math.cos(a) * rnd(0.5, 1.0), yNo - rnd(0.7, 1.3), Math.sin(a) * rnd(0.5, 1.0));
    const curva = new THREE.CatmullRomCurve3([
      new THREE.Vector3(Math.cos(a) * 0.5, yNo + rnd(0, 0.12), Math.sin(a) * 0.5),
      new THREE.Vector3(Math.cos(a) * rnd(0.55, 0.8), yNo - rnd(0.25, 0.5), Math.sin(a) * rnd(0.55, 0.8)),
      fim,
    ]);
    grupo.add(new THREE.Mesh(new THREE.TubeGeometry(curva, 12, rnd(0.01, 0.016), 5), matRafia));
  }
}

// ------------------------------------------- mosquitinhos (gypsophila)
// cachinhos de florzinhas brancas em talos finos, espalhados entre os lírios
function criarMosquitinhos(grupo, centros) {
  const transformes = [];
  const talos = [];
  const dummy = new THREE.Object3D();

  for (const centro of centros) {
    const n = Math.floor(rnd(14, 24));
    const base = centro.clone().add(new THREE.Vector3(0, -0.45, 0));
    for (let i = 0; i < n; i++) {
      const ponta = centro.clone().add(new THREE.Vector3(
        rnd(-0.45, 0.45), rnd(-0.25, 0.5), rnd(-0.45, 0.45)
      ));
      transformes.push({ p: ponta, s: rnd(0.035, 0.065) });
      talos.push({ de: base, ate: ponta });
    }
  }

  const flores = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 6, 5), matMosquitinho, transformes.length
  );
  transformes.forEach((tr, i) => {
    dummy.position.copy(tr.p);
    dummy.scale.setScalar(tr.s);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    flores.setMatrixAt(i, dummy.matrix);
  });
  grupo.add(flores);

  const geoTalo = new THREE.CylinderGeometry(1, 1, 1, 5);
  const hastes = new THREE.InstancedMesh(geoTalo, matTaloFino, talos.length);
  const up = new THREE.Vector3(0, 1, 0);
  talos.forEach((talo, i) => {
    const dirVec = talo.ate.clone().sub(talo.de);
    const len = dirVec.length();
    dummy.position.copy(talo.de).addScaledVector(dirVec, 0.5);
    dummy.quaternion.setFromUnitVectors(up, dirVec.normalize());
    dummy.scale.set(0.008, len, 0.008);
    dummy.updateMatrix();
    hastes.setMatrixAt(i, dummy.matrix);
  });
  grupo.add(hastes);
}

// raminhos verdes finos e soltos, dando o ar despenteado do buquê;
// os curtos preenchem o miolo, os longos escapam para fora
function criarRaminho(grupo, pontoAmarra, curto) {
  const a = rnd(0, Math.PI * 2);
  const alcance = curto ? rnd(0.4, 1.3) : rnd(1.4, 2.7);
  const topo = curto ? rnd(1.4, 2.3) : rnd(1.6, 3.0);
  const curva = new THREE.CatmullRomCurve3([
    pontoAmarra.clone().add(new THREE.Vector3(0, 0.3, 0)),
    new THREE.Vector3(Math.cos(a) * alcance * 0.35, topo * 0.45, Math.sin(a) * alcance * 0.35),
    new THREE.Vector3(Math.cos(a) * alcance * 0.8, topo * 0.85, Math.sin(a) * alcance * 0.8),
    new THREE.Vector3(
      Math.cos(a) * alcance + rnd(-0.3, 0.3), topo, Math.sin(a) * alcance + rnd(-0.3, 0.3)
    ),
  ]);
  grupo.add(new THREE.Mesh(new THREE.TubeGeometry(curva, 24, 0.014, 5), matRaminho));

  // agulhinhas perto da ponta
  const nAgulhas = Math.floor(rnd(6, 11));
  for (let i = 0; i < nAgulhas; i++) {
    const t = rnd(0.55, 0.98);
    const p = curva.getPoint(t);
    const agulha = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.001, rnd(0.12, 0.28), 4), matRaminho);
    agulha.position.copy(p);
    agulha.rotation.set(rnd(0, Math.PI), rnd(0, Math.PI), rnd(0, Math.PI));
    grupo.add(agulha);
  }
}

// ---------------------------------------------------------------- ramalhete
const ramalhete = new THREE.Group();
const pontoAmarra = new THREE.Vector3(0, -2.7, 0);

function adicionarFlor(posicao, eixo) {
  const flor = criarFlor();
  flor.position.copy(posicao);
  flor.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), eixo.clone().normalize());
  flor.rotateY(rnd(0, Math.PI * 2));
  ramalhete.add(flor);

  const base = posicao.clone().addScaledVector(eixo.clone().normalize(), -0.15);
  const { caule, curva } = criarCaule(pontoAmarra.clone(), base, posicao, rnd(0.04, 0.052));
  ramalhete.add(caule);
  const nFolhas = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < nFolhas; i++) {
    ramalhete.add(criarFolhaNoCaule(curva, rnd(0.3, 0.78)));
  }
}

function adicionarBotao(posicao, eixo) {
  const botao = criarBotao();
  botao.position.copy(posicao);
  const inclinado = eixo.clone().normalize();
  botao.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), inclinado);
  botao.rotateZ(rnd(-0.2, 0.2));
  ramalhete.add(botao);

  const { caule, curva } = criarCaule(pontoAmarra.clone(), posicao.clone(), posicao, rnd(0.032, 0.042));
  ramalhete.add(caule);
  if (Math.random() > 0.35) {
    ramalhete.add(criarFolhaNoCaule(curva, rnd(0.4, 0.7)));
  }
}

// flor central quase voltada para cima (leve inclinação natural)
adicionarFlor(
  new THREE.Vector3(rnd(-0.15, 0.15), rnd(1.4, 1.6), rnd(-0.15, 0.15)),
  new THREE.Vector3(rnd(-0.12, 0.12), 1, rnd(-0.12, 0.12))
);

// 4 flores ao redor com raio, altura e inclinação irregulares,
// brotando acima da borda do papel
for (let k = 0; k < 4; k++) {
  const a = (k / 4) * Math.PI * 2 + Math.PI / 4 + rnd(-0.3, 0.3);
  const raio = rnd(1.6, 2.1);
  const pos = new THREE.Vector3(Math.cos(a) * raio, rnd(0.75, 1.25), Math.sin(a) * raio);
  const eixo = new THREE.Vector3(
    Math.cos(a) * rnd(0.6, 0.95) + rnd(-0.15, 0.15),
    rnd(0.7, 1.0),
    Math.sin(a) * rnd(0.6, 0.95) + rnd(-0.15, 0.15)
  );
  adicionarFlor(pos, eixo);
}

// botões agrupados no alto, nos vãos entre as flores e bem acima das
// pétalas, para não atravessarem nenhuma flor
const configBotoes = [
  { angulo: 0    + rnd(-0.25, 0.25), raio: rnd(0.75, 1.0),  altura: rnd(3.05, 3.35) },
  { angulo: 1.57 + rnd(-0.25, 0.25), raio: rnd(0.8, 1.15),  altura: rnd(2.85, 3.1) },
  { angulo: 3.14 + rnd(-0.25, 0.25), raio: rnd(0.75, 1.05), altura: rnd(3.15, 3.45) },
  { angulo: 4.71 + rnd(-0.25, 0.25), raio: rnd(0.85, 1.15), altura: rnd(2.9, 3.15) },
];
for (const cfg of configBotoes) {
  const pos = new THREE.Vector3(
    Math.cos(cfg.angulo) * cfg.raio, cfg.altura, Math.sin(cfg.angulo) * cfg.raio
  );
  const eixo = new THREE.Vector3(
    Math.cos(cfg.angulo) * rnd(0.25, 0.45), 1, Math.sin(cfg.angulo) * rnd(0.25, 0.45)
  );
  adicionarBotao(pos, eixo);
}

// embalagem de papel kraft em duas camadas defasadas
ramalhete.add(criarCamadaEmbalagem(matKraftExterno, 1.0, 0, 0));
ramalhete.add(criarCamadaEmbalagem(matKraftInterno, 0.88, rnd(0.4, 0.9), -0.5));

// amarração de ráfia
criarRafia(ramalhete, pontoAmarra);

// mosquitinhos por todo o buquê: miolo, nível dos lírios, meia-altura e borda
const centrosMosquitinho = [];
// preenchendo o miolo entre os caules
for (let i = 0; i < 10; i++) {
  const a = rnd(0, Math.PI * 2);
  centrosMosquitinho.push(new THREE.Vector3(
    Math.cos(a) * rnd(0.15, 1.4), rnd(0.9, 1.9), Math.sin(a) * rnd(0.15, 1.4)
  ));
}
// no nível dos lírios e acima, aparecendo entre as pétalas
for (let i = 0; i < 7; i++) {
  const a = rnd(0, Math.PI * 2);
  centrosMosquitinho.push(new THREE.Vector3(
    Math.cos(a) * rnd(0.6, 1.9), rnd(1.7, 2.6), Math.sin(a) * rnd(0.6, 1.9)
  ));
}
// bem no alto do meio, despontando acima do buquê entre os botões
for (let i = 0; i < 6; i++) {
  const a = rnd(0, Math.PI * 2);
  centrosMosquitinho.push(new THREE.Vector3(
    Math.cos(a) * rnd(0.2, 1.0), rnd(2.6, 3.4), Math.sin(a) * rnd(0.2, 1.0)
  ));
}
// meia-altura, entre as flores
for (let i = 0; i < 9; i++) {
  const a = rnd(0, Math.PI * 2);
  centrosMosquitinho.push(new THREE.Vector3(
    Math.cos(a) * rnd(1.0, 2.2), rnd(0.8, 1.9), Math.sin(a) * rnd(1.0, 2.2)
  ));
}
// pela borda do papel
for (let i = 0; i < 5; i++) {
  const a = rnd(0, Math.PI * 2);
  centrosMosquitinho.push(new THREE.Vector3(
    Math.cos(a) * rnd(2.0, 2.45), rnd(0.35, 0.85), Math.sin(a) * rnd(2.0, 2.45)
  ));
}
criarMosquitinhos(ramalhete, centrosMosquitinho);

// folhagem verde preenchendo o miolo do buquê, sem deixar vazio entre os caules
for (let i = 0; i < 18; i++) {
  const a = rnd(0, Math.PI * 2);
  const raio = rnd(0.15, 1.6);
  const geo = geometriaPetala({
    comprimento: rnd(0.9, 1.8),
    largura: 0.34 * rnd(0.9, 1.5),
    arco: rnd(0.35, 0.6),
    recurvo: rnd(0.2, 0.5),
    torcao: rnd(-0.35, 0.35),
    ondulacao: rnd(0.02, 0.06),
    assimetria: rnd(-0.05, 0.05),
    canaleta: rnd(0.2, 0.32),
    dobraBorda: rnd(0.02, 0.08),
  });
  const folha = new THREE.Mesh(geo, escolher(materiaisFolha));
  folha.position.set(Math.cos(a) * raio, rnd(0.1, 1.4), Math.sin(a) * raio);
  folha.rotation.y = a + rnd(-0.6, 0.6);
  folha.rotation.x = -rnd(0.1, 0.75);
  folha.rotation.z = rnd(-0.2, 0.2);
  ramalhete.add(folha);
}

// raminhos verdes soltos: longos para fora e curtos preenchendo o miolo
for (let i = 0; i < 9; i++) criarRaminho(ramalhete, pontoAmarra);
for (let i = 0; i < 7; i++) criarRaminho(ramalhete, pontoAmarra, true);

// luz quente dentro do cone para o papel não ficar em sombra fechada
const luzInterna = new THREE.PointLight(0xffe6c4, 1.4, 7);
luzInterna.position.set(0, -0.4, 0);
ramalhete.add(luzInterna);

ramalhete.position.y = 0.2;
scene.add(ramalhete);

// ---------------------------------------------------------------- animação
const relogio = new THREE.Clock();

function animar() {
  requestAnimationFrame(animar);
  const t = relogio.getElapsedTime();

  // ramalhete flutuando suavemente no ar
  ramalhete.position.y = 0.2 + Math.sin(t * 0.8) * 0.14;
  ramalhete.rotation.z = Math.sin(t * 0.5) * 0.025;
  ramalhete.rotation.x = Math.cos(t * 0.6) * 0.02;

  controls.update();
  renderer.render(scene, camera);
}
animar();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
